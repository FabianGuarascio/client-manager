<mat-toolbar color="primary">
  <span>Client Manager</span>

  <ng-container *ngIf="user$ | async as user">
    <a mat-button routerLink="/clientes">Clientes</a>
  </ng-container>

  <span class="spacer"></span>

  <button
    mat-icon-button
    (click)="themeService.toggle()"
    [attr.aria-label]="themeService.isDarkMode ? 'Activar modo claro' : 'Activar modo oscuro'"
    [matTooltip]="themeService.isDarkMode ? 'Modo claro' : 'Modo oscuro'"
  >
    <mat-icon>{{ themeService.isDarkMode ? 'light_mode' : 'dark_mode' }}</mat-icon>
  </button>

  <ng-container *ngIf="user$ | async as user; else loggedOut">
    <span class="user-email">{{ user.email }}</span>
    <button mat-button (click)="logout()">
      <mat-icon>logout</mat-icon>
      Salir
    </button>
  </ng-container>

  <ng-template #loggedOut>
    <a mat-button routerLink="/login">Ingresar</a>
  </ng-template>
</mat-toolbar>

<main class="app-content">
  <router-outlet></router-outlet>
</main>
