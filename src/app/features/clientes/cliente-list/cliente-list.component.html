<div class="page">
  <app-estadisticas [clientes]="clientes"></app-estadisticas>

  <mat-card class="list-card">
    <div class="list-header">
      <mat-form-field appearance="outline" class="filter-field">
        <mat-label>Buscar</mat-label>
        <input
          matInput
          (keyup)="aplicarFiltro($any($event.target).value)"
          placeholder="Nombre, apellido..."
        />
      </mat-form-field>

      <a mat-raised-button color="primary" routerLink="/clientes/nuevo">Nuevo cliente</a>
    </div>

    <div class="loading" *ngIf="cargando">
      <mat-spinner diameter="40"></mat-spinner>
    </div>

    <ng-container *ngIf="!cargando">
      <div class="table-scroll">
        <table mat-table [dataSource]="dataSource" matSort class="clientes-table">
          <ng-container matColumnDef="nombre">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
            <td mat-cell *matCellDef="let cliente">{{ cliente.nombre | capitalizar }}</td>
          </ng-container>

          <ng-container matColumnDef="apellido">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Apellido</th>
            <td mat-cell *matCellDef="let cliente">{{ cliente.apellido | capitalizar }}</td>
          </ng-container>

          <ng-container matColumnDef="edad">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Edad</th>
            <td mat-cell *matCellDef="let cliente">{{ cliente.edad }}</td>
          </ng-container>

          <ng-container matColumnDef="fechaNacimiento">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Fecha de nacimiento</th>
            <td mat-cell *matCellDef="let cliente">{{ cliente.fechaNacimiento | fechaFormato }}</td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="columnas"></tr>
          <tr mat-row *matRowDef="let row; columns: columnas"></tr>

          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell no-data" [attr.colspan]="columnas.length">
              No hay clientes que coincidan con el filtro.
            </td>
          </tr>
        </table>
      </div>

      <mat-paginator
        [pageSizeOptions]="[5, 10, 25]"
        [pageSize]="10"
        showFirstLastButtons
      ></mat-paginator>
    </ng-container>
  </mat-card>
</div>
