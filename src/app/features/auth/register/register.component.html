<div class="auth-page">
  <mat-card class="auth-card">
    <mat-card-title>Crear cuenta</mat-card-title>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" autocomplete="email" />
        <mat-error *ngIf="form.get('email')?.hasError('required')"
          >El email es obligatorio.</mat-error
        >
        <mat-error *ngIf="form.get('email')?.hasError('email')">Ingresá un email válido.</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Contraseña</mat-label>
        <input matInput type="password" formControlName="password" autocomplete="new-password" />
        <mat-error *ngIf="form.get('password')?.hasError('required')"
          >La contraseña es obligatoria.</mat-error
        >
        <mat-error *ngIf="form.get('password')?.hasError('minlength')"
          >Mínimo 6 caracteres.</mat-error
        >
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Confirmar contraseña</mat-label>
        <input
          matInput
          type="password"
          formControlName="confirmPassword"
          autocomplete="new-password"
        />
        <mat-error *ngIf="form.get('confirmPassword')?.hasError('required')"
          >Confirmá tu contraseña.</mat-error
        >
        <mat-error
          *ngIf="form.hasError('passwordsMismatch') && form.get('confirmPassword')?.touched"
        >
          Las contraseñas no coinciden.
        </mat-error>
      </mat-form-field>

      <button
        mat-raised-button
        color="primary"
        type="submit"
        class="full-width"
        [disabled]="loading"
      >
        Registrarme
      </button>
    </form>

    <p class="switch-link">¿Ya tenés cuenta? <a routerLink="/login">Iniciá sesión</a></p>
  </mat-card>
</div>
